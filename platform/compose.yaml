services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: viskopic
      POSTGRES_USER: viskopic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    volumes:
      - database:/var/lib/postgresql/data
      - ./database/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U viskopic -d viskopic"]
      interval: 3s
      retries: 20
  storage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-viskopic-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-storage-password}
    volumes: [documents:/data]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://viskopic:${POSTGRES_PASSWORD:-local-postgres-password}@db:5432/viskopic
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-viskopic-local}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-storage-password}
      S3_BUCKET: submissions
      DEV_ACCESS_KEY: ${DEV_ACCESS_KEY:-local-viskopic-development-key}
      ORGANISATION_ID: local-development
      PORT: 4300
    ports: ["127.0.0.1:4300:4300"]
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}
  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: postgres://viskopic:${POSTGRES_PASSWORD:-local-postgres-password}@db:5432/viskopic
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-viskopic-local}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-storage-password}
      S3_BUCKET: submissions
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:4301:8080"]
    environment:
      PORT: 8080
      API_HOSTPORT: api:4300
    depends_on: [api]
volumes:
  database:
  documents:
