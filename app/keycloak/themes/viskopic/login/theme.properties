# Viskopic sign-in theme. Inherits Keycloak's v2 (PatternFly 5) login pages and restyles them.
parent=keycloak.v2
import=common/keycloak
# css/styles.css comes from the parent theme; viskopic.css overrides it.
styles=css/styles.css css/viskopic.css
# The brand panel is already dark; a single light form side keeps the page consistent.
darkMode=false
