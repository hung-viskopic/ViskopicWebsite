# Viskopic MVP, local development. All ports are bound to localhost only.
#   cp .env.example .env   (then set VISKOPIC_LOCAL_MASTER_KEY_B64)
#   docker compose up --build
# Web: http://localhost:3000   API: http://localhost:8000/docs   Keycloak: http://localhost:18080   S3: http://localhost:8333
# Host ports can be changed in .env if Windows reports "ports are not available".

name: viskopic

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: viskopic
      POSTGRES_USER: viskopic            # owner: migrations only
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viskopic}
      VISKOPIC_APP_PASSWORD: ${VISKOPIC_APP_PASSWORD:-viskopic_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Exposed only for running tests from your machine. 5432 often clashes with a local
    # PostgreSQL install or a Windows reserved port range, so a different port is used.
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viskopic -d viskopic"]
      interval: 3s
      retries: 20

  # Local S3-compatible storage. (MinIO's images were withdrawn in 2026; SeaweedFS replaces it.)
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["127.0.0.1:${S3_HOST_PORT:-8333}:8333"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - kcdata:/opt/keycloak/data   # keep users and sessions across restarts
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes/viskopic:/opt/keycloak/themes/viskopic:ro   # branded sign-in page
    ports: ["127.0.0.1:${KEYCLOAK_HOST_PORT:-18080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40

  migrate:
    build: ./backend
    command: python -m viskopic.migrate
    env_file: .env
    environment: &backend_env
      VISKOPIC_DATABASE_URL: postgresql://viskopic_app:${VISKOPIC_APP_PASSWORD:-viskopic_app}@postgres:5432/viskopic
      VISKOPIC_MIGRATE_DATABASE_URL: postgresql://viskopic:${POSTGRES_PASSWORD:-viskopic}@postgres:5432/viskopic
      VISKOPIC_OIDC_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-18080}/realms/viskopic
      VISKOPIC_OIDC_JWKS_URL: http://keycloak:8080/realms/viskopic/protocol/openid-connect/certs
      VISKOPIC_S3_ENDPOINT_URL: http://s3:8333
      VISKOPIC_S3_ACCESS_KEY: viskopic
      VISKOPIC_S3_SECRET_KEY: viskopic-local-s3-secret
      VISKOPIC_CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./backend
    command: uvicorn viskopic.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: *backend_env
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_started }
      keycloak: { condition: service_healthy }

  worker:
    build: ./backend
    command: python -m viskopic.worker
    env_file: .env
    environment: *backend_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_started }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8000}
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${KEYCLOAK_HOST_PORT:-18080}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  s3data:
  kcdata:
